# TelegramLite — CI build with Swiftgram prebuilt TDLib
#
# Strategy:
#   - Uses Swiftgram/TDLibFramework SPM package — prebuilt xcframework
#     for iOS (device + simulator), checksummed. Updated regularly by
#     Swiftgram team. No TDLib compilation needed.
#   - Workflow patches project.yml at build time to add SPM dep.
#   - Single job: clone repo → patch → xcodegen → xcodebuild → ipa.
#
# Total build time: ~3-5 minutes (download xcframework once, cached by
# SPM in DerivedData/SourcePackages).

name: Build TelegramLite .ipa

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SCHEME: TelegramLite
  CONFIGURATION: Release

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Patch project.yml — add Swiftgram TDLib SPM dep
        run: |
          python3 - <<'PY'
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - package: TDLibFramework\n'
          )
          if old in content:
              content = content.replace(old, new)
          elif 'package: TDLibFramework' not in content:
              content += '\n' + new
          packages_block = (
              '\npackages:\n'
              '  TDLibFramework:\n'
              '    url: https://github.com/Swiftgram/TDLibFramework.git\n'
              '    branch: master\n'
          )
          if 'packages:' not in content:
              content += packages_block
          with open('project.yml', 'w') as f:
                  f.write(content)
          print('Patched project.yml — Swiftgram TDLib SPM dep added.')
          PY
          echo "--- patched project.yml ---"
          cat project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM deps (downloads Swiftgram xcframework, checksummed)
        run: |
          xcodebuild -project TelegramLite.xcodeproj \
                     -scheme "$SCHEME" \
                     -configuration "$CONFIGURATION" \
                     -resolvePackageDependencies

      - name: Build .app (linked against Swiftgram TDLib)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/build.log

      - name: Locate .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::TelegramLite.app not found — build failed."
            tail -100 build/build.log
            exit 1
          fi
          echo "Found app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q ../TelegramLite-unsigned.ipa Payload
          cd ..
          ls -lh TelegramLite-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-unsigned-ipa
          path: TelegramLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: warn
          retention-days: 7

  sign:
    name: Sign .ipa (optional, manual trigger only)
    runs-on: macos-15
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if signing secrets not set
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_PROV_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Add secrets APPLE_CERT_BASE64, APPLE_PROV_PROFILE_BASE64, APPLE_TEAM_ID before triggering this job."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Patch project.yml
        run: |
          python3 - <<'PY'
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - package: TDLibFramework\n'
          )
          if old in content:
              content = content.replace(old, new)
          elif 'package: TDLibFramework' not in content:
              content += '\n' + new
          packages_block = (
              '\npackages:\n'
              '  TDLibFramework:\n'
              '    url: https://github.com/Swiftgram/TDLibFramework.git\n'
              '    branch: master\n'
          )
          if 'packages:' not in content:
              content += packages_block
          with open('project.yml', 'w') as f:
                  f.write(content)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode signing materials
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
        run: |
          set -ex
          mkdir -p build
          echo "$APPLE_CERT_BASE64" | base64 -d > build/dev.p12
          echo "$APPLE_PROV_PROFILE_BASE64" | base64 -d > build/dev.mobileprovision

          KEYCHAIN=build/app.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 1200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import build/dev.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -A
          security list-keychains -s "$KEYCHAIN" login.keychain
          security find-identity -v

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision

      - name: Build signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedDataSigned \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            PROVISIONING_PROFILE_SPECIFIER="dev" \
            build

      - name: Package signed .ipa
        run: |
          APP_PATH=$(find build/DerivedDataSigned/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          mkdir -p build/PayloadSigned
          cp -R "$APP_PATH" build/PayloadSigned/
          cd build/PayloadSigned
          zip -r -q ../../TelegramLite-signed.ipa Payload

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build/app.keychain || true

      - name: Upload signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-signed-ipa
          path: TelegramLite-signed.ipa
          if-no-files-found: error
          retention-days: 90
