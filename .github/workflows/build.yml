# TelegramLite — CI build with Swiftgram TDLib properly statically linked
#
# What was wrong before:
#   - We downloaded TDLibFramework.xcframework and used `framework: ...
#     embed: true` in project.yml
#   - But TDLibFramework.xcframework contains STATIC ARCHIVES (.a), not
#     dynamic frameworks (.dylib)
#   - `embed: true` just copied the .framework folder into the .app
#     bundle, but iOS does NOT load static archives at runtime
#   - The static archive's symbols were never linked into the TelegramLite
#     binary, so dlopen+dlsym at runtime found nothing
#   - Result: app runs in mock mode, spinner spins forever on login
#
# Fix:
#   - Use `xcframework:` dependency (not `framework:`) with `embed: false`
#   - Xcode auto-detects static archive inside xcframework and adds it
#     to OTHER_LDFLAGS as -force_load for the correct platform slice
#   - Symbols get baked into the TelegramLite binary at link time
#   - No more dlopen+dlsym — use `import TDLibFramework` + direct C calls
#     to td_create_client_id / td_send / td_receive

name: Build TelegramLite .ipa

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SCHEME: TelegramLite
  CONFIGURATION: Release
  TDLIB_ZIP_URL: "https://github.com/Swiftgram/TDLibFramework/releases/download/1.8.67-42e6a525/TDLibFramework.zip"

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Frameworks dir + download Swiftgram TDLib
        run: |
          set -ex
          mkdir -p TelegramLite/Frameworks
          curl -L -sS -o td.zip "$TDLIB_ZIP_URL"
          unzip -o td.zip -d td_extract
          find td_extract -name 'TDLibFramework.xcframework' -type d | head -n1
          mv $(find td_extract -name 'TDLibFramework.xcframework' -type d | head -n1) TelegramLite/Frameworks/
          ls -la TelegramLite/Frameworks/TDLibFramework.xcframework/
          echo "--- contents ---"
          ls -la TelegramLite/Frameworks/TDLibFramework.xcframework/*/

      - name: Patch project.yml — link TDLib xcframework + inject api creds
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          # Patch project.yml: replace commented deps block with xcframework dep (embed: false → static link)
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - xcframework: TelegramLite/Frameworks/TDLibFramework.xcframework\n'
              '    embed: false\n'
          )
          if old in content:
              content = content.replace(old, new)
          elif 'xcframework: TelegramLite/Frameworks/TDLibFramework.xcframework' not in content:
              content += '\n' + new
          with open('project.yml', 'w') as f:
              f.write(content)
          print('Patched project.yml — TDLibFramework.xcframework statically linked.')

          # Inject api_id / api_hash into TDLibManager.swift
          api_id = os.environ.get('TG_API_ID', '').strip()
          api_hash = os.environ.get('TG_API_HASH', '').strip()
          if not api_id or not api_hash:
              print('::warning::TG_API_ID / TG_API_HASH secrets not set.')
          else:
              path = 'TelegramLite/Core/TDLibManager.swift'
              with open(path) as f:
                  src = f.read()
              old_id = (
                  '    static let api_id: Int = {\n'
                  '        if let env = ProcessInfo.processInfo.environment["TG_API_ID"],\n'
                  '           let id = Int(env) { return id }\n'
                  '        return 0   // <-- put your api_id here (as Int)\n'
                  '    }()'
              )
              new_id = f'    static let api_id: Int = {api_id}'
              if old_id in src:
                  src = src.replace(old_id, new_id)
              else:
                  print('::warning::api_id pattern not found in TDLibManager.swift.')
              old_hash = (
                  '    static let api_hash: String = {\n'
                  '        ProcessInfo.processInfo.environment["TG_API_HASH"] ?? "" // <-- put your api_hash here\n'
                  '    }()'
              )
              new_hash = f'    static let api_hash: String = "{api_hash}"'
              if old_hash in src:
                  src = src.replace(old_hash, new_hash)
              else:
                  print('::warning::api_hash pattern not found in TDLibManager.swift.')
              with open(path, 'w') as f:
                  f.write(src)
              print(f'Injected TG_API_ID={api_id} and TG_API_HASH={api_hash[:8]}... into TDLibManager.swift.')
          PY
          echo "--- patched project.yml (tail) ---"
          tail -25 project.yml
          echo "--- TDLibManager.swift api lines ---"
          grep "static let api_id\|static let api_hash" TelegramLite/Core/TDLibManager.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (TDLib statically linked into binary)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/build.log

      - name: Locate .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::TelegramLite.app not found — build failed."
            tail -100 build/build.log
            exit 1
          fi
          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          du -sh "$APP_PATH"
          # Critical check: verify TDLib symbols are in the binary
          echo "--- checking TDLib symbols in binary ---"
          nm -gU "$APP_PATH/TelegramLite" 2>/dev/null | grep -E "td_(create_client_id|send|receive|execute)" | head -5 || echo "(no TDLib symbols found via nm)"
          strings "$APP_PATH/TelegramLite" | grep -E "td_(create_client_id|send|receive)" | head -5 || true
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q ../TelegramLite-unsigned.ipa Payload
          cd ..
          ls -lh TelegramLite-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-unsigned-ipa
          path: TelegramLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: warn
          retention-days: 7

  sign:
    name: Sign .ipa (optional, manual trigger only)
    runs-on: macos-15
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if signing secrets not set
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_PROV_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Add secrets APPLE_CERT_BASE64, APPLE_PROV_PROFILE_BASE64, APPLE_TEAM_ID before triggering this job."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download Swiftgram TDLib xcframework
        run: |
          mkdir -p TelegramLite/Frameworks
          curl -L -sS -o td.zip "$TDLIB_ZIP_URL"
          unzip -o td.zip -d td_extract
          mv $(find td_extract -name 'TDLibFramework.xcframework' -type d | head -n1) TelegramLite/Frameworks/

      - name: Patch project.yml + inject api creds
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - xcframework: TelegramLite/Frameworks/TDLibFramework.xcframework\n'
              '    embed: false\n'
          )
          if old in content:
              content = content.replace(old, new)
          elif 'xcframework: TelegramLite/Frameworks/TDLibFramework.xcframework' not in content:
              content += '\n' + new
          with open('project.yml', 'w') as f:
              f.write(content)
          api_id = os.environ.get('TG_API_ID', '').strip()
          api_hash = os.environ.get('TG_API_HASH', '').strip()
          if api_id and api_hash:
              path = 'TelegramLite/Core/TDLibManager.swift'
              with open(path) as f:
                  src = f.read()
              old_id = (
                  '    static let api_id: Int = {\n'
                  '        if let env = ProcessInfo.processInfo.environment["TG_API_ID"],\n'
                  '           let id = Int(env) { return id }\n'
                  '        return 0   // <-- put your api_id here (as Int)\n'
                  '    }()'
              )
              new_id = f'    static let api_id: Int = {api_id}'
              if old_id in src:
                  src = src.replace(old_id, new_id)
              old_hash = (
                  '    static let api_hash: String = {\n'
                  '        ProcessInfo.processInfo.environment["TG_API_HASH"] ?? "" // <-- put your api_hash here\n'
                  '    }()'
              )
              new_hash = f'    static let api_hash: String = "{api_hash}"'
              if old_hash in src:
                  src = src.replace(old_hash, new_hash)
              with open(path, 'w') as f:
                  f.write(src)
              print(f'Injected api_id={api_id} api_hash={api_hash[:8]}...')
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode signing materials
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
        run: |
          set -ex
          mkdir -p build
          echo "$APPLE_CERT_BASE64" | base64 -d > build/dev.p12
          echo "$APPLE_PROV_PROFILE_BASE64" | base64 -d > build/dev.mobileprovision

          KEYCHAIN=build/app.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 1200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import build/dev.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -A
          security list-keychains -s "$KEYCHAIN" login.keychain
          security find-identity -v

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision

      - name: Build signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedDataSigned \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            PROVISIONING_PROFILE_SPECIFIER="dev" \
            build

      - name: Package signed .ipa
        run: |
          APP_PATH=$(find build/DerivedDataSigned/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          mkdir -p build/PayloadSigned
          cp -R "$APP_PATH" build/PayloadSigned/
          cd build/PayloadSigned
          zip -r -q ../../TelegramLite-signed.ipa Payload

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build/app.keychain || true

      - name: Upload signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-signed-ipa
          path: TelegramLite-signed.ipa
          if-no-files-found: error
          retention-days: 90
