# TelegramLite — CI build with Swiftgram TDLib via SPM
#
# Strategy:
#   - Patches project.yml to add SPM dep on Swiftgram/TDLibFramework
#   - xcodegen resolves the SPM package (downloads the binaryTarget
#     xcframework)
#   - xcodebuild links the binaryTarget's static archive into the
#     TelegramLite binary via the wrapper target's transitive dep
#   - In Swift code, `import TDLibFramework` gives access to C
#     functions like td_json_client_create/send/receive/etc.
#   - We call those directly (no dlopen+dlsym hackery).
#
# Total build time: ~3-5 minutes.

name: Build TelegramLite .ipa

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SCHEME: TelegramLite
  CONFIGURATION: Release

jobs:
  build:
    name: Build .ipa
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Patch project.yml — add Swiftgram TDLib SPM dep + inject api creds
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          # 1. Patch project.yml: replace commented deps block with SPM dep
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - package: TDLibFramework\n'
          )
          if old in content:
              content = content.replace(old, new)
          elif 'package: TDLibFramework' not in content:
              content += '\n' + new
          # Also add packages section
          packages_block = (
              '\npackages:\n'
              '  TDLibFramework:\n'
              '    url: https://github.com/Swiftgram/TDLibFramework.git\n'
              '    branch: main\n'
          )
          if 'packages:' not in content:
              content += packages_block
          with open('project.yml', 'w') as f:
              f.write(content)
          print('Patched project.yml — Swiftgram TDLib SPM dep added.')

          # 2. Inject api_id / api_hash into TDLibManager.swift
          api_id = os.environ.get('TG_API_ID', '').strip()
          api_hash = os.environ.get('TG_API_HASH', '').strip()
          if not api_id or not api_hash:
              print('::warning::TG_API_ID / TG_API_HASH secrets not set.')
          else:
              path = 'TelegramLite/Core/TDLibManager.swift'
              with open(path) as f:
                  src = f.read()
              old_id = (
                  '    static let api_id: Int = {\n'
                  '        if let env = ProcessInfo.processInfo.environment["TG_API_ID"],\n'
                  '           let id = Int(env) { return id }\n'
                  '        return 0   // <-- put your api_id here (as Int)\n'
                  '    }()'
              )
              new_id = f'    static let api_id: Int = {api_id}'
              if old_id in src:
                  src = src.replace(old_id, new_id)
              else:
                  print('::warning::api_id pattern not found in TDLibManager.swift.')
              old_hash = (
                  '    static let api_hash: String = {\n'
                  '        ProcessInfo.processInfo.environment["TG_API_HASH"] ?? "" // <-- put your api_hash here\n'
                  '    }()'
              )
              new_hash = f'    static let api_hash: String = "{api_hash}"'
              if old_hash in src:
                  src = src.replace(old_hash, new_hash)
              else:
                  print('::warning::api_hash pattern not found in TDLibManager.swift.')
              with open(path, 'w') as f:
                  f.write(src)
              print(f'Injected TG_API_ID={api_id} and TG_API_HASH={api_hash[:8]}... into TDLibManager.swift.')
          PY
          echo "--- patched project.yml ---"
          cat project.yml
          echo ""
          echo "--- TDLibManager.swift (api lines) ---"
          grep -A1 "static let api_id\|static let api_hash" TelegramLite/Core/TDLibManager.swift | head -10

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve SPM deps (downloads Swiftgram xcframework)
        run: |
          xcodebuild -project TelegramLite.xcodeproj \
                     -scheme "$SCHEME" \
                     -configuration "$CONFIGURATION" \
                     -resolvePackageDependencies

      - name: Build .app (linked against Swiftgram TDLib via SPM)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/build.log

      - name: Locate .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::TelegramLite.app not found — build failed."
            tail -100 build/build.log
            exit 1
          fi
          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          du -sh "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q ../TelegramLite-unsigned.ipa Payload
          cd ..
          ls -lh TelegramLite-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-unsigned-ipa
          path: TelegramLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: warn
          retention-days: 7

  sign:
    name: Sign .ipa (optional, manual trigger only)
    runs-on: macos-15
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if signing secrets not set
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_PROV_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Add secrets APPLE_CERT_BASE64, APPLE_PROV_PROFILE_BASE64, APPLE_TEAM_ID before triggering this job."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Patch project.yml (SPM dep + api creds)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - package: TDLibFramework\n'
          )
          if old in content:
              content = content.replace(old, new)
          elif 'package: TDLibFramework' not in content:
              content += '\n' + new
          packages_block = (
              '\npackages:\n'
              '  TDLibFramework:\n'
              '    url: https://github.com/Swiftgram/TDLibFramework.git\n'
              '    branch: main\n'
          )
          if 'packages:' not in content:
              content += packages_block
          with open('project.yml', 'w') as f:
              f.write(content)
          api_id = os.environ.get('TG_API_ID', '').strip()
          api_hash = os.environ.get('TG_API_HASH', '').strip()
          if api_id and api_hash:
              path = 'TelegramLite/Core/TDLibManager.swift'
              with open(path) as f:
                  src = f.read()
              old_id = (
                  '    static let api_id: Int = {\n'
                  '        if let env = ProcessInfo.processInfo.environment["TG_API_ID"],\n'
                  '           let id = Int(env) { return id }\n'
                  '        return 0   // <-- put your api_id here (as Int)\n'
                  '    }()'
              )
              new_id = f'    static let api_id: Int = {api_id}'
              if old_id in src:
                  src = src.replace(old_id, new_id)
              old_hash = (
                  '    static let api_hash: String = {\n'
                  '        ProcessInfo.processInfo.environment["TG_API_HASH"] ?? "" // <-- put your api_hash here\n'
                  '    }()'
              )
              new_hash = f'    static let api_hash: String = "{api_hash}"'
              if old_hash in src:
                  src = src.replace(old_hash, new_hash)
              with open(path, 'w') as f:
                  f.write(src)
              print(f'Injected api_id={api_id} api_hash={api_hash[:8]}...')
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode signing materials
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
        run: |
          set -ex
          mkdir -p build
          echo "$APPLE_CERT_BASE64" | base64 -d > build/dev.p12
          echo "$APPLE_PROV_PROFILE_BASE64" | base64 -d > build/dev.mobileprovision

          KEYCHAIN=build/app.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 1200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import build/dev.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -A
          security list-keychains -s "$KEYCHAIN" login.keychain
          security find-identity -v

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision

      - name: Build signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedDataSigned \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            PROVISIONING_PROFILE_SPECIFIER="dev" \
            build

      - name: Package signed .ipa
        run: |
          APP_PATH=$(find build/DerivedDataSigned/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          mkdir -p build/PayloadSigned
          cp -R "$APP_PATH" build/PayloadSigned/
          cd build/PayloadSigned
          zip -r -q ../../TelegramLite-signed.ipa Payload

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build/app.keychain || true

      - name: Upload signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-signed-ipa
          path: TelegramLite-signed.ipa
          if-no-files-found: error
          retention-days: 90
