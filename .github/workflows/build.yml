# TelegramLite — CI build with TDLib compiled from source
#
# Strategy:
#   - Two jobs:
#     1. build-tdlib: clones tdlib/td at v1.8.0, builds it for iOS device
#        (arm64) AND iOS simulator (arm64 + x86_64), combines into a
#        proper xcframework. Result cached for 90 days.
#     2. build-app: pulls cached xcframework, drops it into
#        TelegramLite/Frameworks/, links it into the project, produces
#        a real-working .ipa (no mock mode — login will actually talk
#        to Telegram servers).
#
# First run takes ~30 minutes (compiling TDLib). Subsequent runs ~3
# minutes (cache hit).

name: Build TelegramLite .ipa

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  TDLIB_TAG: v1.8.0
  SCHEME: TelegramLite
  CONFIGURATION: Release

jobs:
  build-tdlib:
    name: Build TDLib from source (cached)
    runs-on: macos-15
    outputs:
      cache-hit: ${{ steps.cache-tdlib.outputs.cache-hit }}
    steps:
      - name: Cache TDLib xcframework
        id: cache-tdlib
        uses: actions/cache@v4
        with:
          path: tdlib-build
          key: tdlib-${{ env.TDLIB_TAG }}-xcframework-v3

      - name: Show runner info
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          sw_vers
          xcodebuild -version
          which cmake gperf
          brew --prefix openssl@3 || brew --prefix openssl

      - name: Install build deps
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          brew install cmake gperf openssl@3

      - name: Checkout TDLib source
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ env.TDLIB_TAG }}
          path: td-src

      - name: Build TDLib for iOS device (arm64)
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p td-src/build-device
          cd td-src/build-device
          OPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="13.0" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/tdlib-build/device" \
            ..
          cmake --build . --target install -j4

      - name: Build TDLib for iOS Simulator (arm64 + x86_64)
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          set -ex
          mkdir -p td-src/build-sim
          cd td-src/build-sim
          OPENSSL_ROOT_DIR=$(brew --prefix openssl@3) \
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="13.0" \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/tdlib-build/sim" \
            ..
          cmake --build . --target install -j4

      - name: Combine into xcframework
        if: steps.cache-tdlib.outputs.cache-hit != 'true'
        run: |
          set -ex
          ls -la tdlib-build/device/lib/ tdlib-build/sim/lib/
          xcodebuild -create-xcframework \
            -library tdlib-build/device/lib/libtdjson.a \
            -headers tdlib-build/device/include \
            -library tdlib-build/sim/lib/libtdjson.a \
            -headers tdlib-build/sim/include \
            -output tdlib-build/libtdjson.xcframework
          # Remove the per-arch build dirs to keep cache small
          rm -rf tdlib-build/device tdlib-build/sim
          du -sh tdlib-build

  build-app:
    name: Build TelegramLite .ipa with TDLib
    runs-on: macos-15
    needs: build-tdlib
    steps:
      - name: Checkout TelegramLite
        uses: actions/checkout@v4

      - name: Restore TDLib xcframework from cache
        uses: actions/cache@v4
        with:
          path: tdlib-build
          key: tdlib-${{ env.TDLIB_TAG }}-xcframework-v3
          fail-on-cache-miss: true

      - name: Show cache contents
        run: |
          ls -la tdlib-build/
          ls -la tdlib-build/libtdjson.xcframework/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Drop TDLib framework into project
        run: |
          mkdir -p TelegramLite/Frameworks
          cp -R tdlib-build/libtdjson.xcframework TelegramLite/Frameworks/
          ls -la TelegramLite/Frameworks/libtdjson.xcframework/

      - name: Patch project.yml to link TDLib framework
        run: |
          python3 - <<'PY'
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '    embed: true\n'
              '    codeSignOnCopy: true\n'
          )
          if old in content:
              content = content.replace(old, new)
              with open('project.yml', 'w') as f:
                  f.write(content)
              print('Patched project.yml — TDLib framework linked.')
          else:
              # Already patched (e.g. local dev pre-patched) — leave alone.
              print('project.yml already has dependencies block or pattern not found.')
              # Try alternate: if 'dependencies:' line is present and starts with whitespace-anchored comment, force-enable
              if 'framework: TelegramLite/Frameworks/libtdjson.xcframework' not in content:
                  content += '\n' + new
                  with open('project.yml', 'w') as f:
                      f.write(content)
                  print('Appended dependencies block to project.yml.')
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (linked against TDLib)
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/build.log

      - name: Locate .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::TelegramLite.app not found — build failed."
            tail -100 build/build.log
            exit 1
          fi
          echo "Found app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q ../TelegramLite-unsigned.ipa Payload
          cd ..
          ls -lh TelegramLite-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-unsigned-ipa
          path: TelegramLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: warn
          retention-days: 7

  sign:
    name: Sign .ipa (optional, manual trigger only)
    runs-on: macos-15
    needs: build-app
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if signing secrets not set
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_PROV_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Add secrets APPLE_CERT_BASE64, APPLE_PROV_PROFILE_BASE64, APPLE_TEAM_ID before triggering this job."
            exit 1
          fi

      - name: Restore TDLib from cache
        uses: actions/cache@v4
        with:
          path: tdlib-build
          key: tdlib-${{ env.TDLIB_TAG }}-xcframework-v3
          fail-on-cache-miss: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Drop TDLib framework into project
        run: |
          mkdir -p TelegramLite/Frameworks
          cp -R tdlib-build/libtdjson.xcframework TelegramLite/Frameworks/

      - name: Patch project.yml
        run: |
          python3 - <<'PY'
          with open('project.yml') as f:
              content = f.read()
          old = (
              '# Uncomment after dropping libtdjson.xcframework into TelegramLite/Frameworks/\n'
              '# dependencies:\n'
              '#   - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '#     embed: true\n'
              '#     codeSignOnCopy: true\n'
          )
          new = (
              'dependencies:\n'
              '  - framework: TelegramLite/Frameworks/libtdjson.xcframework\n'
              '    embed: true\n'
              '    codeSignOnCopy: true\n'
          )
          if old in content:
              content = content.replace(old, new)
              with open('project.yml', 'w') as f:
                  f.write(content)
          elif 'framework: TelegramLite/Frameworks/libtdjson.xcframework' not in content:
              content += '\n' + new
              with open('project.yml', 'w') as f:
                  f.write(content)
          PY

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode signing materials
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
        run: |
          set -ex
          mkdir -p build
          echo "$APPLE_CERT_BASE64" | base64 -d > build/dev.p12
          echo "$APPLE_PROV_PROFILE_BASE64" | base64 -d > build/dev.mobileprovision

          KEYCHAIN=build/app.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 1200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import build/dev.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -A
          security list-keychains -s "$KEYCHAIN" login.keychain
          security find-identity -v

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision

      - name: Build signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedDataSigned \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            PROVISIONING_PROFILE_SPECIFIER="dev" \
            build

      - name: Package signed .ipa
        run: |
          APP_PATH=$(find build/DerivedDataSigned/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          mkdir -p build/PayloadSigned
          cp -R "$APP_PATH" build/PayloadSigned/
          cd build/PayloadSigned
          zip -r -q ../../TelegramLite-signed.ipa Payload

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build/app.keychain || true

      - name: Upload signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-signed-ipa
          path: TelegramLite-signed.ipa
          if-no-files-found: error
          retention-days: 90
