# TelegramLite — CI build & .ipa packaging
#
# Strategy:
#   - macos-14 runner (currently available, Xcode 15)
#   - Build the project WITHOUT TDLib linked. The Swift code uses
#     dlopen(nil, RTLD_LAZY) so it still compiles and runs — it just
#     runs in "mock mode" (login screen shows but won't connect).
#   - Produces an unsigned .ipa as a build artifact.
#
# To make the app ACTUALLY connect to Telegram:
#   1. Drop libtdjson.xcframework into TelegramLite/Frameworks/
#   2. Uncomment the `dependencies:` block in project.yml
#   3. Push — workflow rebuilds with TDLib linked.
#
# To produce a SIGNED .ipa for real device install (Apple Dev $99/yr):
#   Add secrets APPLE_CERT_BASE64, APPLE_CERT_PASSWORD,
#   APPLE_PROV_PROFILE_BASE64, APPLE_TEAM_ID — then run via
#   workflow_dispatch.

name: Build TelegramLite .ipa

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SCHEME: TelegramLite
  CONFIGURATION: Release

jobs:
  build:
    name: Build .ipa
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators (sanity)
        run: xcrun simctl list devices available | head -20

      - name: Build .app (unsigned, no TDLib linked — mock mode)
        run: |
          set -ex
          mkdir -p build
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build/build.log

      - name: Locate .app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::TelegramLite.app not found — build failed."
            tail -100 build/build.log
            exit 1
          fi
          echo "Found app: $APP_PATH"
          ls -la "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -q ../TelegramLite-unsigned.ipa Payload
          cd ..
          ls -lh TelegramLite-unsigned.ipa

      - name: Upload unsigned .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-unsigned-ipa
          path: TelegramLite-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          if-no-files-found: warn
          retention-days: 7

  sign:
    name: Sign .ipa (optional, manual trigger only)
    runs-on: macos-14
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail early if signing secrets not set
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_BASE64" ] || [ -z "$APPLE_PROV_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Add secrets APPLE_CERT_BASE64, APPLE_PROV_PROFILE_BASE64, APPLE_TEAM_ID before triggering this job."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Decode signing materials
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROV_PROFILE_BASE64: ${{ secrets.APPLE_PROV_PROFILE_BASE64 }}
        run: |
          set -ex
          mkdir -p build
          echo "$APPLE_CERT_BASE64" | base64 -d > build/dev.p12
          echo "$APPLE_PROV_PROFILE_BASE64" | base64 -d > build/dev.mobileprovision

          KEYCHAIN=build/app.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 1200 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import build/dev.p12 -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -A
          security list-keychains -s "$KEYCHAIN" login.keychain
          security find-identity -v

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp build/dev.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/dev.mobileprovision

      - name: Build signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project TelegramLite.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedDataSigned \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Developer" \
            PROVISIONING_PROFILE_SPECIFIER="dev" \
            build

      - name: Package signed .ipa
        run: |
          APP_PATH=$(find build/DerivedDataSigned/Build/Products -name 'TelegramLite.app' -type d | head -n1)
          mkdir -p build/PayloadSigned
          cp -R "$APP_PATH" build/PayloadSigned/
          cd build/PayloadSigned
          zip -r -q ../../TelegramLite-signed.ipa Payload

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build/app.keychain || true

      - name: Upload signed .ipa
        uses: actions/upload-artifact@v4
        with:
          name: TelegramLite-signed-ipa
          path: TelegramLite-signed.ipa
          if-no-files-found: error
          retention-days: 90
